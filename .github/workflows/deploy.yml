name: Deploy to GitHub Pages

# Only main deploys. The github-pages environment restricts deployments to the
# default branch, so triggering on a feature branch builds fine but is rejected
# at the deploy step.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, but only queue one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test

      - name: Build
        # Pages serves this repo from /<repo-name>/, so the app is built with a
        # matching base path for asset URLs and the service-worker scope.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
        # Turns Pages on automatically instead of requiring the repo setting to
        # be flipped by hand first. Note this only succeeds where the account
        # plan allows Pages: private repos need GitHub Pro/Team.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
